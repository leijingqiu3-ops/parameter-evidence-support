interface:
  display_name: "Parameter Evidence Support (参数文献支撑)"
  short_description: "Integrated literature stack plus evidence workflow: bundled institutional PDF downloader and local-corpus organizer, local search/reader adapters, exact passages, multi-image screenshots, metadata checks, and a fixed-format Chinese DOCX/PDF with explicit 【找不到】 markers."
  default_prompt: "使用 parameter-evidence-support 技能，核对我正文和 SI 的全部参数，找原始文献、下载 PDF、截取原文，按固定格式生成 Word；找不到的写【找不到】。开始前先确认正文、SI 和输出目录。"
